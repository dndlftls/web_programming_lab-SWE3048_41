<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Web Programming Lab Week3</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            body {
                text-align: center;
            }
        </style>
        <script defer src="script.js"></script>
    </head>
    <body>
        <div class="container">
            <div>
                <img
                    src="SKKU_Logo.png"
                    ,
                    alt="SKKU"
                    style="width: 300px; height: 300px"
                />
            </div>
            <div class="box">
                <p>ID</p>
                <input type="txt" id="id" placeholder="아이디를 입력하세요" />
            </div>
            <div class="pw_box">
                <p>PW</p>
                <input
                    type="password"
                    id="pwd"
                    placeholder="비밀번호를 입력하세요"
                />
            </div>
            <div>
                <button type="button" id="login-btn" onlick="alert(hello);">
                    로그인
                </button>
            </div>
        </div>
    </body>
</html>
