<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>Web Programming Lab Week3</title>
        <link rel="stylesheet" href="style.css" />
        <style>
            body {
                text-align: center;
            }
        </style>
        <script defer src="script.js"></script>
    </head>
    <body>
        <form class="container" action="/signup" method="POST">
            <div class="text-container">
                <div>
                    <img
                        src="SKKU_Logo.png"
                        alt="SKKU"
                        style="width: 300px; height: 300px"
                    />
                </div>
                <div class="box">
                    <p>ID</p>
                    <input
                        type="txt"
                        id="userid"
                        name="userid"
                        placeholder="아이디를 입력하세요"
                    />
                </div>
                <div class="pw_box">
                    <p>PW</p>
                    <input
                        type="password"
                        name="userpassword"
                        id="userpassword"
                        placeholder="비밀번호를 입력하세요"
                    />
                </div>
                <div class="pw_box">
                    <p>PW check</p>
                    <input
                        type="password"
                        id="userpasswordcheck"
                        name="userpasswordcheck"
                        placeholder="비밀번호 확인"
                    />
                </div>
            </div>
            <button id="signup-btn">
                <span> 회원가입 </span>
            </button>
        </form>
    </body>
</html>
